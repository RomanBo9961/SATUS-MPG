
<!-- Video de Fondo -->
<video autoplay muted loop playsinline 
  id="bg-video" 
  class="fixed top-0 left-0 min-w-full min-h-full object-cover z-[-30]">
  <source src="https://videos.pexels.com/video-files/30064777/12896225_2560_1440_60fps.mp4" type="video/mp4">
</video>

<!-- Fondo de respaldo -->
<div class="fixed top-0 left-0 w-full h-full bg-satus-bg z-[-20]"></div>

<!-- Capa de oscurecimiento -->
<div class="fixed top-0 left-0 w-full h-full bg-black/60 z-[-10]"></div>

<div class="relative z-0 min-h-screen p-6 font-mono text-gray-300"> 
<!-- Header -->
  <header class="flex justify-between items-center border-b border-satus-neon/20 pb-4 mb-8">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 bg-satus-neon rounded-full animate-pulse"></div>
      <h1 class="text-xl font-bold tracking-tighter text-white">SATUS_CORE</h1>
    </div>
    <div class="text-[10px] text-satus-neon tracking-widest uppercase">
      Status: <span class="text-green-400">Secure</span> | Encryption: Active
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Sección Izquierda: Historial -->
    <section class="lg:col-span-2 space-y-4">
      <h2 class="text-xs uppercase text-gray-500 mb-4 tracking-widest">Recientes_Auditados</h2>
      
   <div *ngFor="let scan of detections" class="bg-satus-dark/40 border border-white/5 p-4 backdrop-blur-sm hover:border-satus-neon/40 transition-all mb-4">
  <div class="flex justify-between items-start mb-2">
    <!-- Fecha real de Mongo -->
    <span class="text-satus-neon text-[10px] uppercase">
      {{ scan.createdAt | date:'dd/MM/yyyy HH:mm' }}
    </span>
    <span [class]="scan.riskLevel === 'ALTO' ? 'text-satus-alert border-satus-alert' : 'text-green-400 border-green-400'" 
          class="text-[10px] border px-2 py-0.5 uppercase">
      {{ scan.riskLevel }}
    </span>
  </div>
  
  <p class="text-sm text-white mb-2 truncate">{{ scan.url }}</p>
  
  <div class="bg-black/40 p-3 text-xs leading-relaxed border-l-2 border-satus-neon italic text-gray-400">
    {{ scan.message }}
  </div>
</div>

      <div *ngIf="detections.length === 0 && !loading" class="text-center py-20 border border-dashed border-white/10">
        <p class="text-gray-600">No se registran amenazas en el sector actual.</p>
      </div>
    </section>

    <!-- Sección Derecha: Stats Rápidos -->
    <aside class="space-y-6">
      <div class="bg-satus-dark/60 border border-satus-neon/20 p-6">
        <h3 class="text-[10px] uppercase text-gray-500 mb-2">Integridad_Sistema</h3>
        <div class="text-3xl font-light text-white">98.2%</div>
        <div class="w-full bg-gray-800 h-1 mt-4">
          <div class="bg-satus-neon h-1 w-[98%] shadow-[0_0_10px_#00f2ff]"></div>
        </div>
      </div>
    </aside>

  </main>
</div>
