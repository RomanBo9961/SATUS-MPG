<div class="min-h-screen flex items-center justify-center bg-black font-mono relative overflow-hidden bg-cover bg-center bg-no-repeat"
    style="background-image: url('/register.png');">
    <div
        class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/90 to-black bg-opacity-80 backdrop-blur-[2px] z-0">
    </div>

    <div class="w-full max-w-md p-8 border border-satus-bronce/20 bg-satus-dark/40 backdrop-blur-xl">
        <header class="mb-8 text-center">
            <h2 class="text-satus-bronce tracking-[0.3em] uppercase text-xl font-bold">Crear Nodo</h2>
            <p class="text-[10px] text-gray-500 mt-2"> Ingrese sus datos y avance hacia una navegación segura. </p>
        </header>

        <form (submit)="onRegister()" class="space-y-6">
            <div>
                <label class="block text-[10px] text-satus-bronce uppercase mb-2">Nombres</label>
                <input name="name" [(ngModel)]="userData.name" type="text" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-bronce outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-satus-bronce uppercase mb-2">Apellidos</label>
                <input name="lastName" [(ngModel)]="userData.lastName" type="text" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-bronce outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-satus-bronce uppercase mb-2">Email</label>
                <input name="email" [(ngModel)]="userData.email" type="email" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-bronce outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-satus-bronce uppercase mb-2">Contraseña</label>
                <input name="password" [(ngModel)]="userData.password" type="password" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-bronce outline-none">
            </div>

            <!-- ST1: BOTÓN DE REGISTRO DEFAULT  -->
            <button *ngIf="!loading && !completed" type="submit"
                class="w-full py-4 border border-satus-bronce text-satus-bronce hover:bg-satus-bronce hover:text-black transition-all uppercase text-xs font-bold tracking-widest">
                [ REGISTRO DE NODO ]
            </button>

            <!-- ST2: BARRA DE CARGA ACTIVA (Mientras loading sea verdadero) -->
            <div *ngIf="loading && !completed"
                class="w-full border border-satus-bronce/40 bg-black/40 p-1 relative overflow-hidden h-[54px] flex items-center justify-center">

                <div class="absolute inset-y-0 left-0 bg-satus-bronce/20 animate-pulse w-full"></div>

                <div
                    class="absolute bottom-0 left-0 h-[2px] bg-satus-bronce animate-[loading-bar_1.5s_infinite_linear] w-1/3">
                </div>

                <span class="text-satus-bronce font-mono text-[10px] tracking-[0.2em] uppercase z-10 animate-pulse">
                    INYECTANDO ATRIBUTOS EN EL NÚCLEO...
                </span>
            </div>

            <!-- ST3: ACCEDER -->
            <button *ngIf="completed" type="button" (click)="goToLogin()"
                class="w-full py-4 bg-satus-bronce text-black transition-all uppercase text-xs font-bold tracking-widest animate-pulse">
                [ ACCEDER ]
            </button>
        </form>

        <p class="mt-6 text-center text-[10px] text-gray-600 lowcase">
            ¿Ya tiene un nodo activo? <a routerLink="/login" class="text-satus-report underline">Inicie Sesión</a>
        </p>
    </div>
</div>
