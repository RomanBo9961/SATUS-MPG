<div class="min-h-screen flex items-center justify-center bg-black font-mono">
    <div class="w-full max-w-md p-8 border border-satus-neon/20 bg-satus-dark/40 backdrop-blur-xl">
        <header class="mb-8 text-center">
            <h2 class="text-satus-neon tracking-[0.3em] uppercase text-xl font-bold">Crear Nodo</h2>
            <p class="text-[10px] text-gray-500 mt-2">// INGRESE CREDENCIALES //</p>
        </header>

        <form (submit)="onRegister()" class="space-y-6">
            <div>
                <label class="block text-[10px] text-satus-neon uppercase mb-2">Username</label>
                <input name="username" type="text" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-neon outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-satus-neon uppercase mb-2">Email</label>
                <input name="email" type="email" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-neon outline-none">
            </div>
            <div>
                <label class="block text-[10px] text-satus-neon uppercase mb-2">Contraseña</label>
                <input name="password" type="password" required
                    class="w-full bg-black/60 border border-white/10 p-3 text-white focus:border-satus-neon outline-none">
            </div>

            <button type="submit"
                class="w-full py-4 border border-satus-neon text-satus-neon hover:bg-satus-neon hover:text-black transition-all uppercase text-xs font-bold tracking-widest">
                [ INICIAR VÍNCULO ]
            </button>
        </form>

        <p class="mt-6 text-center text-[10px] text-gray-600 uppercase">
            ¿Ya tienes un nodo activo? <a routerLink="/login" class="text-satus-neon underline">Inicie Sesion</a>
        </p>
    </div>
</div>
