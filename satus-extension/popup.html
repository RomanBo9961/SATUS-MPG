<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo">SATUS</span>
      <span class="version">CORE_V1.0</span>
    </header>

    <main>
      <div class="user-card">
        <p class="label">PERFIL | NODO |:</p>
        <p id="user-role" class="value">ACCESO ESTANDAR</p>
      </div>

      <div class="status-card">
        <div class="status-info">
          <p class="label">ESCUDO HEURISTICO:</p>
          <p id="status-text" class="value online">ACTIVE</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="shield-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <button id="go-dashboard" class="primary-btn">[ ACCEDER DASHBOARD ]</button>
    </main>

    <footer>
      <p>// SATUS ENGINE //</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
