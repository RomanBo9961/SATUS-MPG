<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <header>
      <span class="logo">SATUS</span>
      <span class="version">CORE_V1.0</span>
    </header>

    <main>
      <div class="user-card">
        <p class="label">PERFIL | NODO |:</p>
        <p id="user-role" class="value">ACCESO ESTANDAR</p>
      </div>

      <div class="status-card">
        <div class="status-info">
          <p class="label">ESCUDO HEURISTICO:</p>
          <p id="status-text" class="value online">ACTIVE</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="shield-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <button id="auth-action-btn" class="primary-btn">[ CARGANDO ]</button>
    </main>

    <footer>
      <!-- Varia o se oculta según los privilegios del analista -->
      <p id="go-dashboard-link" style="cursor: pointer; transition: color 0.2s;">// SATUS ENGINE //</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>

</html>
